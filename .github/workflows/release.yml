name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions: {}

# Three jobs, the same shape as getformo/sdk: dependencies, the build, and the
# tests run in a job with read-only permissions and no OIDC token. Only the
# packed tarball moves on. The publish job installs nothing from the project,
# checks the tarball, and is the only job that can mint the npm OIDC token.
jobs:
  build:
    name: Build and inspect package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: '$TAG' is not a strict semver release tag"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main || {
            echo "Error: release tags must point to a commit on main"
            exit 1
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version
        id: version
        run: |
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$PACKAGE_VERSION" || {
            echo "Error: tag $TAG does not match package.json $PACKAGE_VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          pnpm build
          pnpm test

      - name: Pack and inspect publish contents
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --json --pack-destination "$RUNNER_TEMP/package" > "$RUNNER_TEMP/pack.json"
          PACK_JSON="$RUNNER_TEMP/pack.json" node <<'NODE'
          const fs = require('node:fs')
          const reports = JSON.parse(fs.readFileSync(process.env.PACK_JSON, 'utf8'))
          if (reports.length !== 1) throw new Error(`Expected one tarball, got ${reports.length}`)
          const forbidden = reports[0].files
            .map(({ path }) => path)
            .filter((path) => /(^|\/)(\.envrc|\.env(?!\.example$)(\..+)?|.*\.(pem|key|p12|pfx))$/i.test(path))
          if (forbidden.length) throw new Error(`Sensitive files in package: ${forbidden.join(', ')}`)
          console.log(reports[0].files.map(({ path }) => path).join('\n'))
          NODE

      - name: Upload immutable package candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved tarball
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_NAME: '@formo/analytics-node'
      EXPECTED_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download package candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false

      - name: Install exact npm publishing client
        run: npm install --global npm@11.18.0

      - name: Verify tarball identity and lifecycle hooks
        run: |
          mapfile -t TARBALLS < <(find "$PWD/package" -maxdepth 1 -name '*.tgz' -type f)
          test "${#TARBALLS[@]}" -eq 1 || { echo "Expected exactly one tarball"; exit 1; }
          mkdir inspect
          tar -xzf "${TARBALLS[0]}" -C inspect
          PACKAGE_JSON=inspect/package/package.json node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON, 'utf8'))
          if (pkg.name !== process.env.EXPECTED_NAME) throw new Error(`Unexpected package: ${pkg.name}`)
          if (pkg.version !== process.env.EXPECTED_VERSION) throw new Error(`Unexpected version: ${pkg.version}`)
          for (const hook of ['preinstall', 'install', 'postinstall']) {
            if (pkg.scripts?.[hook]) throw new Error(`Forbidden lifecycle hook: ${hook}`)
          }
          NODE
          test ! -f inspect/package/binding.gyp || { echo "Forbidden implicit install hook: binding.gyp"; exit 1; }
          echo "tarball=${TARBALLS[0]}" >> "$GITHUB_ENV"

      - name: Publish with OIDC provenance
        run: npm publish "$tarball" --provenance --access public

  release:
    name: Create GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for changelog generation
          persist-credentials: false

      - name: Generate release notes
        id: release_notes
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Get the previous version tag (second most recent v* tag by version order)
          # This is more reliable than using git describe which follows commit ancestry
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found"
          else
            echo "Previous tag: $PREV_TAG"
          fi

          # Get current date
          RELEASE_DATE=$(date +%Y-%m-%d)
          # VERSION is provided via the validated env var declared above

          # Generate changelog with PR links
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog from $PREV_TAG to $GITHUB_REF_NAME"
            # Extract commits with PR numbers and format them
            # Use tab as delimiter to safely handle semicolons and special characters
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s	%h" --no-merges)
          else
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"%s	%h" --no-merges)
          fi

          # Process commits and categorize them
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS=$'\t' read -r message hash; do
            # Skip empty lines
            [ -z "$message" ] && continue

            # Extract PR number if exists
            if [[ $message =~ \(#([0-9]+)\) ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
              # Remove the (#PR_NUM) from message to avoid duplication (handles with or without space)
              CLEAN_MESSAGE=$(echo "$message" | sed -E 's/ ?\(#[0-9]+\)//')
              PR_LINK="[#$PR_NUM](https://github.com/$REPO/pull/$PR_NUM)"
              COMMIT_LINK="[$hash](https://github.com/$REPO/commit/$hash)"
              ITEM="$CLEAN_MESSAGE ($PR_LINK) ($COMMIT_LINK)"
            else
              COMMIT_LINK="[$hash](https://github.com/$REPO/commit/$hash)"
              ITEM="$message ($COMMIT_LINK)"
            fi

            # Categorize by prefix and strip conventional commit prefix
            if [[ $message =~ ^feat(\([^\)]+\))?: ]]; then
              # Strip "feat:" or "feat(scope):" from the beginning of ITEM
              STRIPPED_ITEM=$(echo "$ITEM" | sed -E 's/^feat(\([^)]+\))?: //')
              FEATURES="${FEATURES}- ${STRIPPED_ITEM}
          "
            elif [[ $message =~ ^fix(\([^\)]+\))?: ]]; then
              # Strip "fix:" or "fix(scope):" from the beginning of ITEM
              STRIPPED_ITEM=$(echo "$ITEM" | sed -E 's/^fix(\([^)]+\))?: //')
              FIXES="${FIXES}- ${STRIPPED_ITEM}
          "
            else
              OTHER="${OTHER}- ${ITEM}
          "
            fi
          done <<< "$COMMITS"

          # Create release notes
          cat > release_notes.md <<EOF
          $VERSION ($RELEASE_DATE)
          EOF

          # Add Features section if exists
          if [ -n "$FEATURES" ]; then
            cat >> release_notes.md <<EOF

          ## Features

          $FEATURES
          EOF
          fi

          # Add Fixes section if exists
          if [ -n "$FIXES" ]; then
            cat >> release_notes.md <<EOF

          ## Bug Fixes

          $FIXES
          EOF
          fi

          # Add Other changes if exists
          if [ -n "$OTHER" ]; then
            cat >> release_notes.md <<EOF

          ## Changes

          $OTHER
          EOF
          fi

          # Add npm package link
          cat >> release_notes.md <<EOF

          ## Install

          \`\`\`bash
          npm install @formo/analytics-node@$VERSION
          \`\`\`

          [@formo/analytics-node $VERSION npm package](https://www.npmjs.com/package/@formo/analytics-node/v/$VERSION)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
